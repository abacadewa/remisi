name: Update IPTV Playlist

on:
  # Penjelasan ekspresi Cron: menit jam hari bulan minggu. Contoh ini berarti setiap hari pukul 08:00 UTC (16:00 waktu Beijing) dijalankan otomatis
  schedule:
    - cron: '0 8 * * *'
  # Memungkinkan Anda juga memicu manual dari halaman Actions repositori
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Memberikan izin kepada Actions untuk menulis konten, jika tidak akan gagal saat push
    permissions:
      contents: write

    steps:
      # 1. Mengambil kode repositori, memastikan mendapatkan versi terbaru
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan lingkungan Python (jika skrip Anda menggunakan Python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Menjalankan skrip untuk menghasilkan/memperbarui file playlist
      # Ganti dengan nama file skrip Anda sendiri, atau Anda dapat langsung menulis perintah curl untuk mengunduh file
      - name: Run Update Script
        run: python update_playlist.py

      # 4. Mengonfigurasi identitas Git, melakukan commit dan push
      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update playlist at $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
